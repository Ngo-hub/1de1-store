<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1DE1</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#14130f; --muted:#8c8880; --line:rgba(0,0,0,0.12);
    --rail:#b9b4a8; --accent:#c0502a;
    --mono:'Share Tech Mono',monospace; --body:'Rajdhani',system-ui,sans-serif; --serif:'Cinzel',serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;overflow-x:hidden;}
  button{font-family:inherit;cursor:pointer;}

  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(18px,4vw,48px);background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .logo{width:80px;height:36px;background:var(--ink);-webkit-mask:url("white_1de1.png") center/contain no-repeat;mask:url("white_1de1.png") center/contain no-repeat;}
  .nav-r{display:flex;align-items:center;gap:20px;font-family:var(--mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;}
  .nav-r a{color:var(--ink);text-decoration:none;}
  .cart-btn{background:var(--ink);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;}

  /* rack */
  .rack-wrap{width:100%;overflow-x:auto;padding:clamp(28px,6vw,64px) 0 54px;-webkit-overflow-scrolling:touch;}
  .rack{position:relative;min-width:max-content;margin:0 auto;padding:0 clamp(28px,6vw,80px);}
  .rail{position:absolute;top:46px;left:clamp(10px,3vw,40px);right:clamp(10px,3vw,40px);height:5px;border-radius:5px;
    background:linear-gradient(180deg,#d7d2c6,#a7a194);box-shadow:0 2px 6px rgba(0,0,0,0.18);}
  .rail::before,.rail::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#8a8477;transform:translateY(-50%);box-shadow:0 2px 5px rgba(0,0,0,0.25);}
  .rail::before{left:-7px;} .rail::after{right:-7px;}
  .garments{display:flex;align-items:flex-start;gap:clamp(10px,2.4vw,34px);position:relative;z-index:2;}

  .garment{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:clamp(170px,20vw,250px);}
  .hook{width:46px;height:40px;margin-bottom:-6px;}
  .g-img{height:clamp(250px,32vw,380px);width:auto;max-width:100%;display:block;transform-origin:top center;
    mix-blend-mode:multiply;transition:transform .35s cubic-bezier(.2,.8,.2,1);}
  .garment:hover .g-img{transform:translateY(-14px) rotate(-1.2deg);}
  .garment:nth-child(even):hover .g-img{transform:translateY(-14px) rotate(1.2deg);}
  .tag{margin-top:18px;text-align:center;transition:transform .3s;}
  .garment:hover .tag{transform:translateY(-4px);}
  .tag .nm{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;line-height:1.35;color:var(--ink);max-width:190px;}
  .tag .pr{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);margin-top:5px;}
  .hint{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted);padding-bottom:40px;}

  footer{border-top:1px solid var(--line);padding:22px clamp(18px,4vw,48px);display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}

  /* ── modal ── */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(20,19,15,0.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,40px);}
  .modal{background:#fff;border-radius:12px;width:min(880px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;box-shadow:0 30px 80px rgba(0,0,0,0.3);position:relative;}
  .m-close{position:absolute;top:12px;right:14px;z-index:5;background:none;border:none;font-size:22px;color:var(--ink);line-height:1;}
  .m-media{background:#fff;display:flex;align-items:center;justify-content:center;padding:clamp(16px,3vw,34px);position:relative;border-right:1px solid var(--line);}
  .m-img{max-width:100%;max-height:420px;mix-blend-mode:multiply;cursor:zoom-in;}
  .m-flip{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,0.8);padding:5px 10px;border-radius:20px;border:1px solid var(--line);}
  .m-info{padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;gap:16px;}
  .m-name{font-family:var(--serif);font-size:clamp(20px,3.4vw,26px);line-height:1.1;}
  .m-price{font-family:var(--mono);font-size:16px;color:var(--accent);}
  .m-lbl{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:9px 12px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;min-height:40px;}
  .opt.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .opt.size{min-width:46px;text-align:center;}
  .m-add{margin-top:6px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:15px;font-family:var(--mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;}
  .m-add:disabled{background:#bdbdbd;cursor:not-allowed;}
  .m-note{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;}

  /* ── cart drawer ── */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,0.2);
    transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .d-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line);font-family:var(--mono);letter-spacing:0.18em;text-transform:uppercase;font-size:12px;}
  .d-items{flex:1;overflow:auto;padding:10px 20px;}
  .d-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;}
  .d-item img{width:52px;height:64px;object-fit:contain;mix-blend-mode:multiply;}
  .d-item .di-info{flex:1;font-size:13px;}
  .d-item .di-info .n{font-weight:600;line-height:1.2;}
  .d-item .di-info .m{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:3px;}
  .d-item .di-pr{font-family:var(--mono);font-size:12px;}
  .d-rm{background:none;border:none;color:var(--muted);font-size:16px;margin-left:6px;}
  .d-foot{padding:18px 20px;border-top:1px solid var(--line);}
  .d-total{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:14px;}
  .d-checkout{width:100%;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:16px;font-family:var(--mono);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;}
  .d-empty{color:var(--muted);text-align:center;padding:50px 20px;font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:59;}

  @media (max-width:720px){
    .modal{grid-template-columns:1fr;max-height:94vh;}
    .m-media{border-right:none;border-bottom:1px solid var(--line);}
    .m-img{max-height:300px;}
  }
  @media (prefers-reduced-motion:reduce){.g-img,.tag,.drawer{transition:none;}}
</style>
</head>
<body>
  <header>
    <div class="logo" role="img" aria-label="1DE1"></div>
    <nav class="nav-r">
      <a href="#">About</a>
      <button class="cart-btn" id="cartBtn" onclick="openCart()">Cart (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <div class="rack-wrap">
    <div class="rack">
      <div class="rail"></div>
      <div class="garments" id="garments"></div>
    </div>
  </div>
  <div class="hint">◄ drag the rail ►</div>

  <footer><span>1DE1.SHOP</span><span>Fall 2026 · Uno de Uno</span></footer>

<script>
let RACK = [];

const HOOK='<svg viewBox="0 0 46 40" style="width:100%;height:100%"><path d="M23 6 C23 2 28 2 28 7 C28 10 24 11 23 14 L23 40" fill="none" stroke="#6f6a5e" stroke-width="2.4" stroke-linecap="round"/></svg>';
const money = s => '$' + Math.round(parseFloat(s));
let cart = [];

// ── render rack ──
function renderRack(){
  document.getElementById('garments').innerHTML = RACK.map((p,i)=>`
    <div class="garment" onclick="openModal(${i})">
      <div class="hook">${HOOK}</div>
      <img class="g-img" src="${p.colors[0].front}" alt="${p.title}" loading="lazy">
      <div class="tag"><div class="nm">${p.title.replace(/^Unisex /,'')}</div><div class="pr">${money(p.price)}</div></div>
    </div>`).join('');
}
fetch('rack-data.json').then(r=>r.json()).then(function(d){ RACK=d; renderRack(); })
  .catch(function(){ document.getElementById('garments').innerHTML='<div style="padding:40px;font-family:monospace;color:#8c8880">Could not load products.</div>'; });

// ── modal ──
let mState = null;
function openModal(pi){
  const p = RACK[pi];
  mState = { pi, ci:0, size:null, showBack:false };
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.onclick=e=>{ if(e.target===ov) closeModal(); };
  ov.innerHTML=`
    <div class="modal">
      <button class="m-close" onclick="closeModal()">✕</button>
      <div class="m-media">
        <img class="m-img" id="mImg" src="${p.colors[0].front}" alt="${p.title}" onclick="flipImg()">
        <div class="m-flip" onclick="flipImg()">tap to flip ⤺ front / back</div>
      </div>
      <div class="m-info">
        <div><div class="m-name">${p.title}</div><div class="m-price">${money(p.price)}</div></div>
        <div><div class="m-lbl">Color — <span id="mColorName">${p.colors[0].name}</span></div>
          <div class="opts" id="mColors">${p.colors.map((c,ci)=>`<button class="opt ${ci===0?'sel':''}" onclick="setColor(${ci})">${c.name}</button>`).join('')}</div></div>
        <div><div class="m-lbl">Size <span style="color:#c0502a">· men's sizing, size up</span></div>
          <div class="opts" id="mSizes">${p.colors[0].sizes.map(s=>`<button class="opt size" onclick="setSize('${s.size}')">${s.size}</button>`).join('')}</div></div>
        <button class="m-add" id="mAdd" disabled onclick="addToCart()">Select a size</button>
        <div class="m-note">Made to order · final sale · ships worldwide</div>
      </div>
    </div>`;
  document.body.appendChild(ov); document.body.style.overflow='hidden';
}
function closeModal(){ const ov=document.getElementById('ov'); if(ov) ov.remove(); document.body.style.overflow=''; }
function curColor(){ return RACK[mState.pi].colors[mState.ci]; }
function setColor(ci){
  mState.ci=ci; mState.showBack=false; mState.size=null;
  const c=curColor();
  document.getElementById('mImg').src=c.front;
  document.getElementById('mColorName').textContent=c.name;
  [...document.querySelectorAll('#mColors .opt')].forEach((b,i)=>b.classList.toggle('sel',i===ci));
  document.getElementById('mSizes').innerHTML=c.sizes.map(s=>`<button class="opt size" onclick="setSize('${s.size}')">${s.size}</button>`).join('');
  const add=document.getElementById('mAdd'); add.disabled=true; add.textContent='Select a size';
}
function setSize(sz){
  mState.size=sz;
  [...document.querySelectorAll('#mSizes .opt')].forEach(b=>b.classList.toggle('sel',b.textContent===sz));
  const add=document.getElementById('mAdd'); add.disabled=false; add.textContent='Add to Cart';
}
function flipImg(){ const c=curColor(); mState.showBack=!mState.showBack; document.getElementById('mImg').src=mState.showBack?c.back:c.front; }
function addToCart(){
  const p=RACK[mState.pi], c=curColor();
  const v=c.sizes.find(s=>s.size===mState.size); if(!v) return;
  const ex=cart.find(x=>x.id===v.id); if(ex) ex.qty++; else cart.push({id:v.id, qty:1, title:p.title, color:c.name, size:mState.size, price:parseFloat(p.price), img:c.front});
  updateCart(); closeModal(); openCart();
}

// ── cart ──
function updateCart(){ document.getElementById('cartCount').textContent = cart.reduce((a,i)=>a+i.qty,0); }
function openCart(){
  let bd=document.getElementById('bd');
  if(!bd){ bd=document.createElement('div'); bd.className='backdrop'; bd.id='bd'; bd.onclick=closeCart; document.body.appendChild(bd); }
  let dr=document.getElementById('dr');
  if(!dr){
    dr=document.createElement('div'); dr.className='drawer'; dr.id='dr'; document.body.appendChild(dr);
  }
  renderCart();
  requestAnimationFrame(()=>dr.classList.add('open'));
  document.body.style.overflow='hidden';
}
function closeCart(){ const dr=document.getElementById('dr'); const bd=document.getElementById('bd'); if(dr)dr.classList.remove('open'); if(bd)bd.remove(); document.body.style.overflow=''; }
function renderCart(){
  const dr=document.getElementById('dr'); if(!dr) return;
  const total = cart.reduce((a,i)=>a+i.price*i.qty,0);
  dr.innerHTML=`
    <div class="d-head"><span>Your Bag</span><button class="m-close" style="position:static" onclick="closeCart()">✕</button></div>
    <div class="d-items">${cart.length? cart.map((it,ix)=>`
      <div class="d-item">
        <img src="${it.img}" alt="">
        <div class="di-info"><div class="n">${it.title}</div><div class="m">${it.color} · ${it.size} · x${it.qty}</div></div>
        <div class="di-pr">$${Math.round(it.price*it.qty)}</div>
        <button class="d-rm" onclick="removeItem(${ix})">✕</button>
      </div>`).join('') : '<div class="d-empty">Your bag is empty</div>'}</div>
    ${cart.length?`<div class="d-foot">
      <div class="d-total"><span>Total</span><span>$${Math.round(total)}</span></div>
      <button class="d-checkout" onclick="checkout()">Checkout</button>
    </div>`:''}`;
}
function removeItem(ix){ cart.splice(ix,1); updateCart(); renderCart(); }
function checkout(){
  if(!cart.length) return;
  const path = cart.map(i=>i.id+':'+i.qty).join(',');
  window.location.href = 'https://1de1.co/cart/' + path;
}
</script>
</body>
</html>
